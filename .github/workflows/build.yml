name: build

# Two builds:
# - src-assem: the from-scratch toolchain (tools/asm86/, tools/plmc.py)
#   assembling/compiling src-assem/ into its bootable floppy. Plain-
#   stdlib Python, so it runs on all three major OSes.
# - src-c: the C port (see docs/src-c.md). It needs the i686-elf cross
#   toolchain (gcc, binutils, grub-file), a host `cc` for the
#   differential tests' ctypes libraries, and qemu-system-i386 for the
#   boot tests -- the names src-c/build.mk and tests/src-c/ use. macOS
#   gets them from Homebrew, as a developer's machine does; Linux gets
#   gcc/binutils from Homebrew too and qemu/grub-file from apt. There's
#   no Windows job: no packaged i686-elf toolchain there.
#
# Each uploads its bootable floppy image as its own artifact, so it can
# be downloaded and booted directly.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  src-assem:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Windows runners default to PowerShell; Git Bash (with GNU
        # grep/cat/mkdir) is present on all three OSes and is what the
        # Makefile's recipes assume.
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y

      - name: make
        run: make -C src-assem

      - name: make disk (bootable QEMU floppy image)
        run: make -C src-assem disk

      - name: upload bootable disk image
        uses: actions/upload-artifact@v7
        with:
          name: mpm86q-floppy-image-${{ matrix.os }}
          path: src-assem/build/disk/mpm86q.img
          if-no-files-found: error

  src-c:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: install the cross toolchain and QEMU (macOS)
        if: runner.os == 'macOS'
        run: brew install i686-elf-gcc i686-elf-binutils i686-elf-grub qemu

      - name: install the cross toolchain and QEMU (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 grub-common
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install i686-elf-gcc i686-elf-binutils
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          # grub-file is target-independent; the build calls it by its
          # i686-elf name
          mkdir -p "$HOME/bin"
          ln -s "$(command -v grub-file)" "$HOME/bin/i686-elf-grub-file"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: make (build, then test)
        run: make -C src-c

      - name: make disk (bootable QEMU floppy image)
        run: make -C src-c disk

      - name: upload bootable disk image
        uses: actions/upload-artifact@v7
        with:
          name: mpm86c-floppy-image-${{ matrix.os }}
          path: src-c/build/mpm86c.img
          if-no-files-found: error

  docs-pdf:
    # Renders every docs/*.md to PDF with pandoc. A single Linux job,
    # not part of the build matrix above: the output is OS-independent
    # and there's no reason to pay for it three times.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: install pandoc and a LaTeX engine
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex

      - name: convert docs/*.md to PDF
        run: |
          mkdir -p build/docs-pdf
          for f in docs/*.md; do
            name=$(basename "$f" .md)
            pandoc "$f" --pdf-engine=xelatex -o "build/docs-pdf/$name.pdf"
          done

      - name: upload docs PDFs
        uses: actions/upload-artifact@v7
        with:
          name: docs-pdf
          path: build/docs-pdf/
          if-no-files-found: error
